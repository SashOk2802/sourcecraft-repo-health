name: sourcecraft-repo-health

services:
  frontend:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      # Docker-демо использует настоящий backend. Для изолированной вёрстки
      # можно явно задать VITE_USE_MOCKS=true в локальном .env.
      VITE_USE_MOCKS: "${VITE_USE_MOCKS:-false}"
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://repo_health:repo_health@postgres:5432/repo_health
      REDIS_URL: redis://redis:6379/0
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_SESSION_COOKIE_SECURE: ${YANDEX_SESSION_COOKIE_SECURE:-false}
      SOURCECRAFT_TOKEN: ${SOURCECRAFT_TOKEN:-}
      SOURCECRAFT_PUBLIC_ORGANIZATIONS: ${SOURCECRAFT_PUBLIC_ORGANIZATIONS:-}
    ports: ["8000:8000"]
    volumes: ["./backend:/app/backend"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >-
      sh -lc "python -m unittest discover -s backend/tests -v &&
      ruff check backend --ignore EXE002"
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro
      - ./scripts:/app/scripts:ro
      - ./.github:/app/.github:ro
      - ./compose.yaml:/app/compose.yaml:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repo_health
      POSTGRES_USER: repo_health
      POSTGRES_PASSWORD: repo_health
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_health -d repo_health"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  frontend_node_modules:
  postgres_data:
