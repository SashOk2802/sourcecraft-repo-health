# A deliberately narrow Compose definition for the frontend-volume upgrade test.
# Keeping it separate prevents the test from creating or using postgres_data.
services:
  frontend:
    build:
      context: ../frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
