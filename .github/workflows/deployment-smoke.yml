name: Demo deployment smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Require configured demo URL
        run: test -n "$DEMO_BASE_URL"
      - name: Verify deployed production surface
        run: python scripts/check_production_deployment.py "$DEMO_BASE_URL"
