name: CI

on:
  # Для feature-ветки достаточно запуска по pull request. Это не ставит две
  # одинаковые серии задач в очередь единственного self-hosted runner.
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: repo_health
          POSTGRES_USER: repo_health
          POSTGRES_PASSWORD: repo_health
        ports:
          # GitHub назначает свободный host-порт: VPS уже может использовать 5432.
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U repo_health -d repo_health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://repo_health:repo_health@127.0.0.1:${{ job.services.postgres.ports[5432] }}/repo_health
        run: alembic upgrade head
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://repo_health:repo_health@127.0.0.1:${{ job.services.postgres.ports[5432] }}/repo_health
        run: python -m unittest discover -s backend/tests -v
      - name: Check Python code
        run: ruff check backend --ignore EXE002

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Compose configuration
        run: docker compose config --quiet
      # `config --quiet` проверяет только синтаксис. Поднимаем чистый стек,
      # чтобы Dockerfile, миграции Alembic и healthcheck'и действительно были
      # совместимы на новой машине до попадания изменения в main.
      - name: Start clean application stack
        run: docker compose -p repo-health-ci up --build --wait
      - name: Verify application endpoints
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/api/v1/health
          curl --fail --silent --show-error http://localhost:8000/api/v1/methodology
      - name: Stop clean application stack
        if: always()
        run: docker compose -p repo-health-ci down --volumes --remove-orphans
      - name: Test frontend upgrade from a root-owned node_modules volume
        run: bash scripts/test_frontend_volume_upgrade.sh
      - name: Test AppSec snapshot read-only mount across Docker users
        run: bash scripts/test_appsec_snapshot_mount.sh
