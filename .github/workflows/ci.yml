name: CI

on:
  # Для feature-ветки достаточно запуска по pull request. Это не ставит две
  # одинаковые серии задач в очередь единственного self-hosted runner.
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: repo_health
          POSTGRES_USER: repo_health
          POSTGRES_PASSWORD: repo_health
        ports:
          # GitHub назначает свободный host-порт: VPS уже может использовать 5432.
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U repo_health -d repo_health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://repo_health:repo_health@127.0.0.1:${{ job.services.postgres.ports[5432] }}/repo_health
        run: alembic upgrade head
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://repo_health:repo_health@127.0.0.1:${{ job.services.postgres.ports[5432] }}/repo_health
        run: python -m unittest discover -s backend/tests -v
      - name: Check Python code
        run: ruff check backend --ignore EXE002

  windows-git-safety:
    name: Windows Git safety
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify bounded Git process-tree cleanup
        run: >-
          python -m unittest
          backend.tests.test_personal_git_analysis.BoundedGitRepositoryTest
          -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Compose configuration
        run: docker compose config --quiet
      - name: Check production Compose configuration
        env:
          DATABASE_URL: postgresql+asyncpg://repo_health:ci-only@postgres:5432/repo_health
          POSTGRES_PASSWORD: ci-only
          SOURCECRAFT_TOKEN: ci-placeholder
        run: docker compose -f compose.production.yaml config --quiet
      # `config --quiet` проверяет только синтаксис. Поднимаем чистый стек,
      # чтобы Dockerfile, миграции Alembic и healthcheck'и действительно были
      # совместимы на новой машине до попадания изменения в main.
      - name: Start clean application stack
        run: docker compose -p repo-health-ci up --build --wait
      - name: Verify application endpoints
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/api/v1/health
          curl --fail --silent --show-error http://localhost:8000/api/v1/methodology
      - name: Stop clean application stack
        if: always()
        run: docker compose -p repo-health-ci down --volumes --remove-orphans
      # This is intentionally a separate stack from the development Compose
      # smoke above. It proves that the image served in production is static
      # nginx rather than a Vite source server, and that same-origin /api
      # proxying survives a clean boot.
      - name: Start production-mode static stack
        env:
          DATABASE_URL: postgresql+asyncpg://repo_health:ci-only@postgres:5432/repo_health
          POSTGRES_PASSWORD: ci-only
          SOURCECRAFT_DISCOVER_PUBLIC_REPOSITORIES: "false"
          PUBLIC_ANALYSIS_SCHEDULER_ENABLED: "false"
        run: docker compose -p repo-health-production-ci -f compose.production.yaml up --build --wait
      - name: Verify production-mode frontend and API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5173/ | grep -qviE '/@vite/client|/src/main\.tsx'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5173/@vite/client)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5173/src/main.tsx)" = 404
          curl --fail --silent --show-error http://127.0.0.1:5173/api/v1/health
      - name: Stop production-mode static stack
        if: always()
        run: docker compose -p repo-health-production-ci -f compose.production.yaml down --volumes --remove-orphans
      - name: Test frontend upgrade from a root-owned node_modules volume
        run: bash scripts/test_frontend_volume_upgrade.sh
      - name: Test AppSec snapshot read-only mount across Docker users
        run: bash scripts/test_appsec_snapshot_mount.sh
