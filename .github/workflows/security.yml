name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Сканеру достаточно читать код. Права на PR-комментарии и запись отсутствуют.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Не публикуем потенциально чувствительный отчёт в PR или artifact.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  python-sast:
    name: Python SAST
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned SAST scanner in an isolated environment
        run: |
          python -m venv .sast-venv
          .sast-venv/bin/python -m pip install pip==26.2.1
          .sast-venv/bin/python -m pip install bandit==1.9.4
      - name: Scan application Python code
        run: >-
          .sast-venv/bin/bandit -r backend/app
          --severity-level medium
          --confidence-level medium
          --ignore-nosec

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies in an isolated environment
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install pip==26.2.1
          .audit-venv/bin/python -m pip install -e ".[dev]" pip-audit==2.10.1
      - name: Audit installed Python dependencies
        run: .audit-venv/bin/python -m pip_audit --local --skip-editable

  frontend-dependency-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit locked frontend dependencies
        run: npm audit --package-lock-only --audit-level=high
